[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivuq"
version = "0.1.0"
description = "Uncertainty-quantified option pricing and implied-volatility surface reconstruction (US equity/index options)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.0",
    "yfinance>=0.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]
fast = ["numba>=0.60"]
lse = ["lse-data"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
